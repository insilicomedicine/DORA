apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dora.fullname" . }}-nginx
  labels:
    {{- include "dora.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ .Values.nginx.replicaCount }}
  selector:
    matchLabels:
      {{- include "dora.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        {{- include "dora.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nginx
    spec:
      initContainers:
        # Copy static files from backend image
        - name: copy-static
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              python /dora/manage.py collectstatic --noinput
              cp -r /dora/static/* /static-files/
          env:
            {{- include "dora.backendEnv" . | nindent 12 }}
          volumeMounts:
            - name: static-files
              mountPath: /static-files
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
            - name: static-files
              mountPath: /var/www/static
              readOnly: true
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "dora.fullname" . }}-nginx-config
        - name: static-files
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dora.fullname" . }}-nginx
  labels:
    {{- include "dora.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    - port: {{ .Values.nginx.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "dora.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
