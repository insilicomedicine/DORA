#cloud-config
package_update: true
package_upgrade: true
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - jq
  - lsb-release
  - software-properties-common
  - docker.io

# Ensure directories needed by later write_files entries exist (write_files does not create nested dirs like /opt/dora/bin by default)
bootcmd:
  - [bash, -c, "mkdir -p /opt/dora/bin"]

write_files:
  - path: /opt/dora/docker-compose.yml
    owner: root:root
    permissions: "0644"
    content: |
      # docker compose specification (v2). 'version' key omitted (deprecated warning otherwise)
      services:
        nginx:
          image: nginx:1.25-alpine
          container_name: dora_nginx
          restart: always
          depends_on:
            - dora_backend
            - frontend
          ports:
            - "80:80"
          volumes:
            - /opt/dora/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - /mnt/dora-data/static:/var/www/static
          networks:
            - main

        frontend:
          image: __ACR_LOGIN_SERVER__/dora-frontend:s3proxy
          container_name: dora_frontend
          restart: always
          depends_on:
            - dora_backend
          expose:
            - "8000"
          networks:
            - main

        dora_backend:
          image: __ACR_LOGIN_SERVER__/dora-backend:s3proxy
          container_name: dora_backend
          restart: always
          command: /bin/sh -c "sleep 5 && python /dora/manage.py collectstatic --noinput && python /dora/manage.py migrate --noinput && uwsgi --ini /dora/deploy/uwsgi.ini --enable-threads"
          depends_on:
            - dora_db
            - dora_redis
          expose:
            - "8080"
          env_file:
            - /opt/dora/.env
          volumes:
            - /mnt/dora-data/static:/dora/static
          networks:
            - main

        dora_worker:
          image: __ACR_LOGIN_SERVER__/dora-backend:s3proxy
          container_name: dora_backend_worker
          restart: always
          env_file:
            - /opt/dora/.env
          depends_on:
            - dora_db
            - dora_redis
          volumes:
            - /mnt/dora-data/logs:/dora/logs
          command: /bin/sh -c "sleep 10 && celery -A app worker -E -l INFO -c 4 --without-heartbeat --without-gossip --without-mingle & celery -A app worker -E -Q email -l INFO -c 1 --without-heartbeat --without-gossip --without-mingle"
          networks:
            - main

        dora_backend_ws:
          image: __ACR_LOGIN_SERVER__/dora-backend:s3proxy
          container_name: dora_backend_ws
          restart: always
          env_file:
            - /opt/dora/.env
          expose:
            - "8081"
          depends_on:
            - dora_db
            - dora_redis
          command: /bin/sh -c "sleep 10 && daphne --bind 0.0.0.0 --port 8081 app.asgi:application"
          networks:
            - main

        dora_db:
          image: pgvector/pgvector:pg16
          container_name: dora_db
          restart: always
          expose:
            - "5432"
          environment:
            POSTGRES_USER: dora
            POSTGRES_PASSWORD: dora
            POSTGRES_DB: dora
          volumes:
            - /mnt/dora-data/postgres:/var/lib/postgresql/data
          networks:
            - main

        dora_redis:
          image: redis:7.2.3
          container_name: dora_redis
          restart: always
          expose:
            - "6379"
          volumes:
            - /mnt/dora-data/redis:/data
          networks:
            - main

        s3proxy:
          image: andrewgaul/s3proxy:latest
          container_name: s3proxy
          restart: unless-stopped
          expose:
            - "80"
          environment:
            JCLOUDS_PROVIDER: "azureblob"
            JCLOUDS_AZUREBLOB_AUTH: "azureKey"
            JCLOUDS_ENDPOINT: "__AZURE_STORAGE_ACCOUNT_URL__"
            JCLOUDS_IDENTITY: "__AZURE_STORAGE_ACCOUNT_NAME__"
            JCLOUDS_CREDENTIAL: "__AZURE_STORAGE_ACCOUNT_KEY__"
            S3PROXY_AUTHORIZATION: "aws-v2-or-v4"
            S3PROXY_IDENTITY: "__S3PROXY_IDENTITY__"
            S3PROXY_CREDENTIAL: "__S3PROXY_CREDENTIAL__"
          networks:
            - main

      networks:
        main:
          name: dora_network

  - path: /opt/dora/nginx.conf
    owner: root:root
    permissions: "0644"
    content: |
      server {
          listen 80;
          server_name _;
          charset utf-8;
          server_tokens off;
          client_max_body_size 0;

          location ~* /static/(admin|img|drf_spectacular_sidecar|dist|users) {
              root /var/www;
          }

          location / {
              proxy_pass http://dora_frontend:8000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
          }

          location ~* /(api|users|admin|openapi) {
              include uwsgi_params;
              uwsgi_pass dora_backend:8080;
              uwsgi_read_timeout 3600;
              uwsgi_send_timeout 3600;
              uwsgi_param X-Real-IP $remote_addr;
              uwsgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
              uwsgi_param X-Forwarded-Proto $http_x_forwarded_proto;
          }

          location /ws/ {
              proxy_pass http://dora_backend_ws:8081;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
          }

          location /s3/ {
              rewrite ^/s3/(.*) /$1 break;
              proxy_pass http://s3proxy:80;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Content-Type "";
              proxy_set_header Content-MD5 "";
          }

          error_page 500 502 503 504 /50x.html;
          location = /50x.html {
              root /usr/share/nginx/html;
              internal;
          }
      }

