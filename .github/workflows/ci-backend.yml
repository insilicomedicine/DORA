name: Backend CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  checks:
    name: Backend Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v1
        with:
          version: "latest"
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          uv sync --frozen --only-dev

      - name: Run backend linting
        working-directory: ./backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

  tests:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run tests with docker-compose
        working-directory: ./backend
        env:
          TEST_RUN: True
        run: |
          docker compose -f docker-compose.test.yml down --remove-orphans --volumes || true
          
          docker compose -f docker-compose.test.yml build dora_backend
          
          docker compose -f docker-compose.test.yml run --rm -e TEST_RUN=True dora_backend /bin/bash -c "coverage run manage.py test -v 2"
          
          docker compose -f docker-compose.test.yml down --remove-orphans --volumes

  build:
    name: Build Backend Image and Push to Registry
    runs-on: ubuntu-latest
    needs: [checks, tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dora-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dora-backend:latest
