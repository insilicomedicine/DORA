server {
    listen 8000;
    root /usr/share/nginx/html/;
    index index.html;
    server_tokens off;

    location /static {
        alias /usr/share/nginx/html/static/;
    }

    location / {
        try_files $uri @index;
    }

    location @index {
        add_header Cache-Control no-cache;
        expires 0;
        try_files /index.html =404;
    }
}
