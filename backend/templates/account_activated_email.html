{% load static %}
<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap");
      body {
        font-family: "Roboto-Regular", sans-serif;
      }

      .content,
      .content * {
        box-sizing: border-box;
      }
      .content {
        margin: 0 auto;
        background: #ffffff;
        max-width: 368px;
        height: 510px;
        text-align: center;
      }

      .button-chemistry {
        width: 100%;
        background: #21965f;
        border-radius: 8px;
        padding: 0;
        position: relative;
        text-decoration: none;
      }

      .btn-label {
        color: #ffffff;
        text-align: center;
        font-family: "Roboto-Regular", sans-serif;
        font-size: 16px;
        line-height: 26px;
        letter-spacing: 0.02em;
        font-weight: 700;
        text-transform: uppercase;
        text-align: center;
        width: 100%;
      }

      .title {
        text-align: center;
        font-family: "Montserrat", "Roboto-Regular", sans-serif;
        color: #212121;
        font-size: 22px;
        font-style: normal;
        font-weight: 900;
        line-height: normal;
        margin-top: 24px;
      }

      .desc {
        color: #212121;
        font-family: var(
          --headers-18-font-family,
          "Roboto-Regular",
          sans-serif
        );
        font-size: 18px;
        font-style: normal;
        font-weight: 400;
        line-height: 153%;
        letter-spacing: 0.15px;
        margin-top: 93px;
        margin-bottom: 48px;
      }

      .footer {
        width: 100%;
        color: #666666;
        font-family: "Roboto-Regular", sans-serif;
        font-size: 14px;
        line-height: 125%;
        text-align: left;
        position: relative;
      }

      .image-footer {
        width: 92px;
        height: 43px;
        margin-left: auto;
        float: right;
      }
    </style>
    <title>Account confirmation</title>
